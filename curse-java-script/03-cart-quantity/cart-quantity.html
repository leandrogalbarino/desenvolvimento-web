<body>
    <h1>Cart Quantity</h1>
    <button onclick="
        console.log(`Cart quantity:${ cartQuantity}`);

        cartQuantity++;

        cartQuantity +=3;
    ">+3</button>

        console.log('Cart reset!')
        cartQuantity  = 0;
    ">Reset Cart</button>

    <script>
        let cartQuantity = 0;

    </script>
