<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>

<body>
    <main>
        <section class="game">
            <h1>Rock, Papel and Scissors</h1>
            <div class="game-options">
                <button class="button-game" onclick="
                    game(0);
                    "><img src="image-project/rock-emoji.png" alt="rock"></button>
                <button class="button-game" onclick="
                    game(1);
                "><img src="image-project/paper-emoji.png" alt="paper"></button>
                <button class="button-game" onclick="
                    game(2);
                "><img src="image-project/scissors-emoji.png" alt="scissors"></button>
            </div>
            <div class="round-container">
                <p class="js-round-result round-result"></p>
                <p class="js-round-play round-play"></p>
            </div>
            <div class="score-container">
                <p class="score">
                </p>
                <button class="button-reset" onclick="
                    scoreReset();
                ">Reset Score</button>
            </div>
        </section>
    </main>
    <script src="scripts/rock-paper-scissors.js"></script>

</body>

</html>
